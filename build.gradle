plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    mavenCentral()
    maven {
        url = uri("https://jitpack.io")
    }
    maven {
        url = uri("https://repo.codemc.io/repository/maven-snapshots/")
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation(include("net.kyori:adventure-platform-fabric:${project.adventure_fabric_version}"))
    implementation(include("org.yaml:snakeyaml:2.7"))
    implementation(include("org.sejda.imageio:webp-imageio:0.1.6"))
    implementation(include("com.logisticscraft:occlusionculling:0.0.8-SNAPSHOT"))
    
    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
    compileOnly files('libs/iris-fabric-1.10.9+mc26.1.1.jar')
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}

// Forward perf-suite properties from the Gradle command line to the game, e.g.
// ./gradlew runClient -Dalumite.perf.run=after -Dalumite.perf.compare=before -Dalumite.perf.exit=true
// ./gradlew runClient -Dalumite.perf.world=after -Dalumite.perf.exit=true
tasks.matching { it.name == 'runClient' }.configureEach { task ->
    System.properties.each { key, value ->
        if (key.toString().startsWith('alumite.perf.')) {
            task.systemProperty key.toString(), value.toString()
        }
    }
    // -Palumite.perf.lowEnd=true runs the game like a 2-core, 2 GB machine so low-end behaviour can be profiled.
    if (findProperty('alumite.perf.lowEnd')?.toString() == 'true') {
        task.jvmArgs '-XX:ActiveProcessorCount=2', '-Xmx2G'
        task.systemProperty 'alumite.perf.lowEnd', 'true'
    }
}
